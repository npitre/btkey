# Stay usable as a Bluetooth speaker; stop offering to be a headset.
#
# Copy to ~/.config/wireplumber/wireplumber.conf.d/50-no-hfp.conf and
# restart wireplumber.  It goes there rather than anywhere under /etc
# because these profiles are WirePlumber's to offer or withhold, not
# bluetoothd's, so btkey cannot drop them for you.
#
# Dropping the hfp and hsp roles leaves a phone no headset profile to route
# call audio into, while a2dp_sink keeps its media audio arriving here.
# a2dp_source is dropped as well: that is what lets *this* machine play out
# to Bluetooth headphones, so put it back in the list if you want that.
#
# Changing this list means forgetting the phone and pairing it again, since
# iOS reads the profile set once, when it bonds.  docs/SETUP.md has the
# rest.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink bap_sink bap_source ]
  bluez5.hfphsp-backend = none
}
